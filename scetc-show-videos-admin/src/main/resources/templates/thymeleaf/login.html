<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>ReelHub管理后台 - 登录</title>
<link rel="stylesheet" th:href="@{/static/css/bootstrap.min.css}" />
<link rel="stylesheet" th:href="@{/static/css/font-awesome.min93e3.css?v=4.4.0}" />
<style>
	html, body {
		height: 100%;
	}
	body {
		margin: 0;
		font-family: "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
		background: #f2f2f2;
		color: #111827;
	}
	.page {
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 32px 24px;
	}
	.shell {
		width: 1200px;
		max-width: 100%;
		display: grid;
		grid-template-columns: 1.1fr 0.9fr;
		gap: 48px;
		align-items: center;
	}
	@media (max-width: 1023px) {
		.shell {
			grid-template-columns: 1fr 1fr;
			gap: 24px;
		}
	}
	@media (max-width: 767px) {
		.shell {
			grid-template-columns: 1fr;
		}
	}
	.left {
		min-height: 520px;
		position: relative;
		border-radius: 20px;
		background: #f2f2f2;
		overflow: hidden;
	}
	.left-inner {
		position: absolute;
		inset: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 24px;
	}
	.brand-mark {
		position: absolute;
		top: 18px;
		left: 18px;
		z-index: 5;
		max-width: 220px;
		font-weight: 800;
		line-height: 1.5;
		letter-spacing: 0.5px;
		color: #111827;
		opacity: 0.92;
	}
	.brand-mark small {
		display: block;
		font-weight: 600;
		opacity: 0.7;
		margin-top: 6px;
		letter-spacing: 0;
	}
	.illustration {
		width: min(720px, 100%);
		height: 420px;
		position: relative;
	}
	.char {
		position: absolute;
		transform: translateZ(0);
		transition: transform 240ms ease, filter 240ms ease;
		filter: drop-shadow(0 14px 18px rgba(0,0,0,0.08));
	}
	.char[data-tone="orange"] { background: #f08a3f; }
	.char[data-tone="purple"] { background: #6d4cff; }
	.char[data-tone="black"] { background: #121212; }
	.char[data-tone="yellow"] { background: #ead34a; }
	.char.orange {
		z-index: 3;
		left: 110px;
		bottom: 64px;
		width: 260px;
		height: 180px;
		border-radius: 180px 180px 26px 26px;
	}
	.char.yellow {
		z-index: 4;
		left: 450px;
		bottom: 50px;
		width: 200px;
		height: 290px;
		border-radius: 120px;
	}
	.char.black {
		z-index: 2;
		left: 330px;
		bottom: 90px;
		width: 150px;
		height: 250px;
		border-radius: 20px;
		background: linear-gradient(180deg, #171717, #0f0f0f);
	}
	.char.purple {
		z-index: 1;
		left: 160px;
		bottom: 210px;
		width: 430px;
		height: 300px;
		border-radius: 26px;
		transform: rotate(-10deg);
	}
	.char .face {
		position: absolute;
		inset: 0;
	}
	.eyes {
		position: absolute;
		display: flex;
		gap: 16px;
		align-items: center;
		justify-content: center;
	}
	.eye {
		width: 34px;
		height: 26px;
		background: #ffffff;
		border-radius: 999px;
		position: relative;
		box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06);
		overflow: hidden;
		transform: scale(var(--eye-scale, 1));
		transition: transform 200ms ease;
	}
	.pupil {
		width: 10px;
		height: 10px;
		background: #111827;
		border-radius: 999px;
		position: absolute;
		left: 50%;
		top: 50%;
		transform: translate(calc(-50% + var(--px, 0px)), calc(-50% + var(--py, 0px)));
		transition: transform 80ms linear;
	}
	.mouth {
		position: absolute;
		left: 50%;
		transform: translateX(-50%);
		width: 44px;
		height: 16px;
		border-radius: 0 0 999px 999px;
		border: 3px solid rgba(0,0,0,0.2);
		border-top: 0;
		opacity: 0.7;
	}
	.mouth.flat {
		height: 0;
		border-radius: 0;
		border: 0;
		border-bottom: 3px solid rgba(0,0,0,0.28);
		width: 60px;
	}
	.orange .eyes { top: 72px; left: 78px; }
	.orange .mouth { bottom: 48px; }
	.yellow .eyes { top: 98px; left: 62px; }
	.yellow .mouth { bottom: 86px; }
	.black .eyes { top: 92px; left: 32px; gap: 14px; }
	.purple .eyes { top: 140px; left: 120px; }
	.purple .mouth { bottom: 128px; }
	.purple .sunglasses {
		position: absolute;
		top: 118px;
		left: 112px;
		width: 120px;
		height: 44px;
		background: rgba(17, 24, 39, 0.82);
		border-radius: 12px;
		transform: rotate(6deg);
		opacity: 0;
		transition: opacity 200ms ease;
	}
	.purple .sunglasses::before,
	.purple .sunglasses::after {
		content: "";
		position: absolute;
		top: 10px;
		width: 34px;
		height: 18px;
		border-radius: 9px;
		background: rgba(255, 255, 255, 0.15);
	}
	.purple .sunglasses::before { left: 10px; }
	.purple .sunglasses::after { right: 10px; }
	.scene[data-scene="idle"] .purple .sunglasses { opacity: 1; }
	.scene[data-scene^="focus"] .char { transform: translateY(-4px); }
	.scene[data-scene="focus-username"] .eye,
	.scene[data-scene="focus-captcha"] .eye { --eye-scale: 1.12; }
	.scene[data-scene="focus-password"] .eye { --eye-scale: 1.06; }
	.scene[data-scene="focus-username"] .char,
	.scene[data-scene="focus-captcha"] .char {
		transform: translateX(10px) translateY(-6px);
	}
	.scene[data-scene="focus-password"] .char {
		transform: translateX(6px) translateY(-4px);
	}
	.scene[data-scene="reveal-password"] .char .eye {
		background: #ffffff;
	}
	.scene[data-scene="reveal-password"] .char .pupil {
		opacity: 0;
	}
	.scene[data-scene="reveal-password"] .char .eye::after {
		content: "";
		position: absolute;
		left: 0;
		top: 50%;
		width: 100%;
		height: 3px;
		background: rgba(17,24,39,0.5);
		transform: translateY(-50%);
	}
	.scene[data-scene="submitting"] .char { transform: translateY(-2px) scale(0.99); }
	@keyframes reelhub-bounce {
		0% { transform: translateY(-10px) scale(1.02); }
		35% { transform: translateY(-16px) scale(1.03); }
		100% { transform: translateY(-10px) scale(1.02); }
	}
	@keyframes reelhub-shake {
		0% { transform: translateY(0) rotate(0deg); }
		20% { transform: translateY(0) rotate(-2deg); }
		45% { transform: translateY(0) rotate(2deg); }
		70% { transform: translateY(0) rotate(-1deg); }
		100% { transform: translateY(0) rotate(0deg); }
	}
	.scene[data-scene="success"] .char { animation: reelhub-bounce 520ms ease-in-out 1; }
	.scene[data-scene="error"] .char { animation: reelhub-shake 520ms ease-in-out 1; }
	.scene[data-scene="error"] .eye { --eye-scale: 1.14; }
	.scene[data-scene="error"] .orange .mouth { border-color: rgba(0,0,0,0.25); transform: translateX(-50%) rotate(180deg); }
	.scene[data-scene="error"] .purple .mouth { border-color: rgba(0,0,0,0.25); transform: translateX(-50%) rotate(180deg); }
	.scene[data-scene="error"] .yellow .mouth { background: rgba(17,24,39,0.35); height: 3px; border: none; }
	.right {
		display: flex;
		justify-content: flex-end;
	}
	.card {
		width: 460px;
		max-width: 100%;
		background: #ffffff;
		border-radius: 18px;
		box-shadow: 0 24px 60px rgba(0,0,0,0.12);
		padding: 32px;
	}
	.card-head {
		margin-bottom: 18px;
	}
	.card-title {
		margin: 0;
		font-size: 26px;
		font-weight: 800;
		letter-spacing: 0.2px;
		color: #111827;
	}
	.card-subtitle {
		margin-top: 8px;
		color: #6b7280;
		font-size: 13px;
	}
	.form-field {
		margin-top: 14px;
	}
	.form-label {
		font-size: 12px;
		font-weight: 700;
		color: #374151;
		margin-bottom: 6px;
	}
	.form-control {
		display: block;
		width: 100%;
		box-sizing: border-box;
		height: 44px;
		border-radius: 12px;
		border: 1px solid #e5e7eb;
		box-shadow: none;
		padding: 10px 12px;
		font-size: 14px;
	}
	.form-control:focus {
		border-color: #111827;
		box-shadow: 0 0 0 3px rgba(17,24,39,0.08);
	}
	.field-row {
		display: grid;
		grid-template-columns: minmax(0, 1fr) 132px;
		gap: 10px;
		align-items: center;
	}
	.field-row .captcha-input {
		flex: 1;
	}
	.captcha-img {
		display: block;
		width: 132px;
		height: 44px;
		border-radius: 12px;
		border: 1px solid #e5e7eb;
		cursor: pointer;
		background: #fff;
		object-fit: cover;
	}
	.pwd-wrap {
		position: relative;
	}
	.pwd-toggle {
		position: absolute;
		top: 50%;
		right: 10px;
		transform: translateY(-50%);
		border: 0;
		background: transparent;
		width: 38px;
		height: 38px;
		border-radius: 10px;
		cursor: pointer;
	}
	.pwd-toggle:focus { outline: none; box-shadow: 0 0 0 3px rgba(17,24,39,0.08); }
	.pwd-toggle .eye-icon {
		position: relative;
		width: 18px;
		height: 12px;
		display: inline-block;
		border: 2px solid #6b7280;
		border-radius: 999px;
	}
	.pwd-toggle .eye-icon::after {
		content: "";
		position: absolute;
		left: 50%;
		top: 50%;
		width: 5px;
		height: 5px;
		background: #6b7280;
		border-radius: 999px;
		transform: translate(-50%, -50%);
	}
	.pwd-toggle[data-open="true"] .eye-icon {
		border-color: #111827;
	}
	.pwd-toggle[data-open="true"] .eye-icon::after {
		background: #111827;
	}
	.primary-btn {
		margin-top: 18px;
		width: 100%;
		height: 44px;
		border-radius: 12px;
		border: 0;
		background: #111827;
		color: #fff;
		font-size: 15px;
		font-weight: 800;
		letter-spacing: 0.2px;
		transition: transform 160ms ease, opacity 160ms ease;
	}
	.primary-btn:hover { opacity: 0.94; }
	.primary-btn:active { transform: translateY(1px); }
	.primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }
	.error-text {
		margin-top: 12px;
		min-height: 18px;
		color: #ef4444;
		font-size: 13px;
	}
	.hint {
		margin-top: 14px;
		background: #f3f4f6;
		border-radius: 14px;
		padding: 12px;
		color: #6b7280;
		font-size: 12px;
		line-height: 1.6;
	}
	.sr-only {
		position: absolute;
		width: 1px;
		height: 1px;
		padding: 0;
		margin: -1px;
		overflow: hidden;
		clip: rect(0, 0, 0, 0);
		white-space: nowrap;
		border: 0;
	}
	@media (max-width: 767px) {
		.brand-mark {
			position: relative;
			top: 0;
			left: 0;
			margin-bottom: 16px;
		}
		.left {
			min-height: auto;
		}
		.left-inner {
			position: relative;
			padding-top: 0;
		}
	}
</style>
</head>
<body>
	<div class="page scene" data-scene="idle" id="sceneRoot">
		<div class="shell">
			<div class="left">
				<div class="brand-mark">
					ReelHub管理后台
					<small>安全登录，进入管理控制台</small>
				</div>
				<div class="left-inner">
					<div class="illustration" id="illustration">
						<div class="char purple" data-tone="purple" data-char="purple">
							<div class="face">
								<div class="sunglasses"></div>
								<div class="eyes">
									<div class="eye" data-eye="1"><div class="pupil" data-pupil="1"></div></div>
									<div class="eye" data-eye="1"><div class="pupil" data-pupil="1"></div></div>
								</div>
								<div class="mouth" data-mouth="1"></div>
							</div>
						</div>
						<div class="char black" data-tone="black" data-char="black">
							<div class="face">
								<div class="eyes">
									<div class="eye" data-eye="1"><div class="pupil" data-pupil="1"></div></div>
									<div class="eye" data-eye="1"><div class="pupil" data-pupil="1"></div></div>
								</div>
							</div>
						</div>
						<div class="char orange" data-tone="orange" data-char="orange">
							<div class="face">
								<div class="eyes">
									<div class="eye" data-eye="1"><div class="pupil" data-pupil="1"></div></div>
									<div class="eye" data-eye="1"><div class="pupil" data-pupil="1"></div></div>
								</div>
								<div class="mouth" data-mouth="1"></div>
							</div>
						</div>
						<div class="char yellow" data-tone="yellow" data-char="yellow">
							<div class="face">
								<div class="eyes">
									<div class="eye" data-eye="1"><div class="pupil" data-pupil="1"></div></div>
									<div class="eye" data-eye="1"><div class="pupil" data-pupil="1"></div></div>
								</div>
								<div class="mouth flat" data-mouth="1"></div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="right">
				<div class="card" role="region" aria-label="管理员登录">
					<div class="card-head">
						<h1 class="card-title">ReelHub管理后台</h1>
						<div class="card-subtitle">请输入用户名、密码与验证码登录</div>
					</div>
					<form id="myform" method="post" autocomplete="off">
						<div class="form-field">
							<div class="form-label">用户名</div>
							<input type="text" name="username" class="form-control" placeholder="请输入用户名" autocomplete="username" />
						</div>
						<div class="form-field">
							<div class="form-label">密码</div>
							<div class="pwd-wrap">
								<input id="passwordInput" type="password" name="password" class="form-control" placeholder="请输入密码" autocomplete="current-password" />
								<button id="pwdToggle" class="pwd-toggle" type="button" aria-label="显示或隐藏密码" data-open="false">
									<span class="sr-only">显示或隐藏密码</span>
									<span class="eye-icon" aria-hidden="true"></span>
								</button>
							</div>
						</div>
						<div class="form-field">
							<div class="form-label">验证码</div>
							<div class="field-row">
								<input type="text" id="user_input_verifyCode" name="verifyCode" class="form-control captcha-input" placeholder="请输入验证码" autocomplete="off" />
								<img class="captcha-img" id="verifyCodeImage" alt="验证码" th:src="@{/other/imageCode.do}" th:attr="data-url=@{/other/imageCode.do}" />
							</div>
							<div style="margin-top:8px; font-size:12px; color:#2563eb; cursor:pointer;" id="captchaRefresh">看不清？换一张</div>
						</div>
						<button class="primary-btn" id="loginBtn" type="button">登录</button>
						<div class="error-text" id="message" role="status" aria-live="polite"></div>
						<div class="hint">仅支持管理员账号登录。如忘记账号，请联系系统管理员。</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>

<script th:src="@{/static/js/jquery-2.1.1.min.js}"></script>
<script th:src="@{/static/js/reelhub-login.js}"></script>
</html>
