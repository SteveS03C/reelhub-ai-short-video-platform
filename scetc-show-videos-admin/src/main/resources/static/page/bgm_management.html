<style>

}

#toolbar {
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 10px;
	padding: 12px 0 18px;
}

#toolbar .btn {
	border-radius: 999px;
	padding: 8px 18px;
	font-weight: 600;
	box-shadow: none;
}

#toolbar .btn i {
	margin-right: 6px;
}

#typeButton {
	border-color: #4c84ff;
	color: #4c84ff;
	background: #f4f8ff;
}

#triggerUpload {
	background: linear-gradient(135deg, #3f8cff, #6b5cff);
	border: none;
	color: #fff;
	padding: 8px 20px;
	box-shadow: 0 10px 22px rgba(76, 132, 255, 0.28);
	border-radius: 4px;
	display: inline-block;
	vertical-align: middle;
	line-height: 1.5;
	font-size: 14px;
	cursor: pointer;
	position: relative;
	overflow: hidden;
}

#triggerUpload:hover,
#triggerUpload:focus {
	color: #fff;
	background: linear-gradient(135deg, #377ff0, #5d4ff0);
}

#toolbar .btn-danger {
	box-shadow: 0 8px 18px rgba(242, 99, 123, 0.2);
}

#picker {
	position: absolute;
	left: -9999px;
	top: -9999px;
	width: 1px;
	height: 1px;
	overflow: hidden;
}

#thelist {
	display: none;
}
</style>

<body class="white-bg" style="opacity: 0">

					</a>

						<li><a href="#">选项2</a></li>
					</ul>
					<a class="close-link"> <i class="fa fa-times"></i>
					</a>
				</div>
			</div>
			<div class="ibox-content">
				<div class="row row-lg">

						</table>
						<div id="toolbar">
							<button class="type btn btn-outline btn-primary" type="button"

							<div style="display:inline-block; vertical-align:middle; margin-right:10px;">

							</div>
							<button class=" btn btn-danger" type="button"
								onclick="getSelectRows(1)">

							</button>
							<div id="uploader" class="wu-example">
								<div id="thelist" class="uploader-list" style="display:none;"></div>
								<div class="btns">

								</div>

					</div>

				<div class="modal inmodal" id="myModal" tabindex="-1" role="dialog"
					aria-hidden="true">

						<form role="form" class="form-horizontal" >

							<div class="input-group m-b">

							<div class="input-group m-b">

									id="newLink" class="form-control " >

	<script type="text/javascript" src="../js/jquery.min.js"></script>
	<script type="text/javascript" src="../js/webuploader.js"></script>
	<script src="../js/plugins/bootstrap-table/bootstrap-table.min.js"></script>

	<script

	<script src="../js/highlight.pack.js"></script>
	<script>
		hljs.initHighlightingOnLoad();
	</script>
	<script src="../js/bootstrap.min.js"></script>
	<!-- 自定义js -->
	<script src="../js/plugins/sweetalert/sweetalert.min.js"></script>
	<script src="../js/contabs.js"></script>
	<script src="../js/fakeLoader.min.js"></script>
	<script src="../js/bgm/bgmTable.js"></script>
	<script src="../js/content.js"></script>
	<script
		src="../js/plugins/validate/jquery.validate.min.js"></script>
	<script
		src="../js/plugins/validate/messages_zh.min.js"></script>


	<!-- Bootstrap table -->
	<script type="text/javascript">
		$(function() {
			var hasAcceptedResponse = false;

			function redirectToLogin() {
				swal({
					title : "登录已失效",
					text : "请重新登录后台后再上传BGM",
					type : "warning"
				}, function() {
					window.top.location.href = "../../adminUser/login";
				});
			}

			function looksLikeLoginPage(response) {
				if (!response) {
					return false;
				}
				if (typeof response === "string") {
					return response.indexOf("后台管理系统 - 登录") > -1
						|| response.indexOf("adminUser/login") > -1
						|| response.indexOf("<html") > -1;
				}
				return false;
			}

			$.ajax({
				url : "../../bgm/selectBgmList",
				type : "POST",
				data : {
					page : 1,
					pageSize : 1
				},
				success : function(res) {
					if (looksLikeLoginPage(res)) {
						redirectToLogin();
					}
				},
				error : function(xhr) {
					if (xhr && xhr.responseText && looksLikeLoginPage(xhr.responseText)) {
						redirectToLogin();
					}
				}
			});

			var uploader = WebUploader.create({
				swf : '../js/Uploader.swf',
				server : '../../bgm/addSubmit.do',
				pick : {
					id : '#picker',
					multiple : false
				},
				resize : false,
				auto: false,
				chunked : false,
				fileSingleSizeLimit : 50 * 1024 * 1024,
                accept: {
                    title: '音频文件',
                    extensions: 'mp3',
                    mimeTypes: 'audio/*'
                }
			});
			uploader.on('error', function(type) {
				if (type === 'Q_TYPE_DENIED') {
					swal("仅支持mp3", "请重新选择 mp3 格式的音频文件", "warning");
					return;
				}
				if (type === 'F_EXCEED_SIZE') {
					swal("文件过大", "后台当前限制单个 BGM 不能超过 50MB", "warning");
					return;
				}
				swal("上传失败", "文件校验未通过，请重新选择文件", "error");
			});
			$("#triggerUpload").on("click", function() {
				var input = $("#picker").find("input[type='file']");
				if (input.length) {
					input.trigger("click");
				}
			});
			uploader.on('fileQueued', function(file) {
				hasAcceptedResponse = false;
				if (file.ext !== 'mp3') {
					swal("仅支持mp3", "请重新选择mp3文件", "warning");
					uploader.removeFile(file, true);
					return;
				}
				swal("开始上传", "正在上传: " + file.name, "info");
				uploader.upload(file);
			});

			uploader.on('uploadSuccess', function(file, response) {
				if (looksLikeLoginPage(response)) {
					redirectToLogin();
				}
			});

			uploader.on('uploadError', function(file, reason) {
				if (hasAcceptedResponse) {
					return;
				}
				swal("上传失败", reason || "文件上传出错，请重试", "error");
			});

			uploader.on('uploadAccept', function(file, response) {
				if (typeof response === "string") {
					try {
						response = JSON.parse(response);
					} catch (e) {}
				}
				if (looksLikeLoginPage(response)) {
					redirectToLogin();
					return false;
				}
				if (!response || response.status !== 200) {
					swal("上传失败", response && response.msg ? response.msg : "服务器处理失败", "error");
					return false;
				}
				hasAcceptedResponse = true;
				var count = response.data && response.data.successCount ? response.data.successCount : 1;
				var detail = "成功入库 " + count + " 条BGM记录";
				if (response.data && response.data.insertedId) {
					detail += "\nID: " + response.data.insertedId + "\n名称: " + response.data.insertedName;
				}
				swal("上传成功", detail, "success");
				return true;
			});

			uploader.on('uploadComplete', function(file) {
				uploader.removeFile(file, true);
				$(".search input").val("");
				$("#allBgm").bootstrapTable('refresh');
				hasAcceptedResponse = false;
			});
		});
	</script>
</body>
