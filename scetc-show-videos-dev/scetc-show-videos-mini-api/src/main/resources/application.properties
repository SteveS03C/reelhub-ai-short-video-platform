# Redis
spring.redis.database=1
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=
spring.redis.pool.max-active=1000
spring.redis.pool.max-wait=-1
spring.redis.pool.max-idle=10
spring.redis.pool.min-idle=2
spring.redis.timout=0

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/scetc_show_video_dev?characterEncoding=utf8&useSSL=false&serverTimezone=GMT
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.druid.initial-size=1
spring.datasource.druid.min-idle=1
spring.datasource.druid.max-active=20
spring.datasource.druid.test-on-borrow=true
spring.datasource.druid.stat-view-servlet.allow=true

# MyBatis
mybatis.type-aliases-package=com.show.pojo
mybatis.mapper-locations=classpath:mapper/*.xml
mapper.mappers=com.show.utils.MyMapper
mapper.not-empty=false
mapper.identity=MYSQL

# PageHelper
pagehelper.helperDialect=mysql
pagehelper.supportMethodsArguments=true
pagehelper.params=count=countSql

# Upload
spring.http.multipart.maxFileSize=100Mb
spring.http.multipart.maxRequestSize=1000Mb
web.upload.path=./runtime-upload/videos

# FFmpeg
ffmepg.path=/path/to/ffmpeg

# Server
server.port=8080
server.tomcat.uri-encoding=UTF-8

classpath_mapping=classpath:/META-INF/resources/
url_mapping=file:./runtime-upload/videos/
page_size=5

logging.level.com.show.mapper=debug

# AI video question answering
qwen.api.endpoint=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
qwen.api.model=qvq-max-2025-03-25
qwen.api.key=your_dashscope_api_key
qwen.video.frame-count=4
